<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Jump</title>
    <style>
        body {
            width: 1880px;
            height: 1000px;
            background-color: rgb(175, 172, 172);
            position: relative;
            margin: 0;
            overflow: hidden;
        }
        .box-2 {
            width: 200px;
            height: 1020px;
            background-color: rgb(95, 91, 91);
            position: absolute;
            top: 0px;
            left: 0px;
        }
        .box-1 {
            width: 200px;
            height: 1020px;
            background-color: rgb(95, 91, 91);
            position: absolute;
            top: 0px;
            left: 1695px;
        }
        .box-3 {
            width: 1880px;
            height: 200px;
            background-color: rgb(95, 91, 91);
            position: absolute;
            top: 0px;
            left: 0px;
        }
        #video {
            width: 1480px;
            height: 600px;
            object-fit: cover;
            position: absolute;
            left: 200px;
            top: 200px;
        }
        /* 타이틀 텍스트 스타일 */
        .game-title {
            position: absolute;
            top: 50px;
            left: 790px;
            font-size: 48px;
            font-weight: bold;
            color: white;
        }
        /* 다운로드 버튼 스타일 */
        .download-btn {
            width: 300px;
            height: 80px;
            background-color: #848c92;
            color: white;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            left: 790px;
            top: 490px;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            z-index: 10;
        }
        .download-btn:hover {
            background-color: #292c2e;
        }

        /* --- 햄버거 메뉴 및 메뉴창 스타일 --- */
        .menu-container {
            position: absolute;
            top: 60px;
            right: 50px;
            z-index: 100;
        }

        /* 햄버거 버튼 (가로줄 3개) */
        .hamburger-btn {
            width: 45px;
            height: 40px;
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 0;
        }

        .hamburger-btn span {
            display: block;
            width: 100%;
            height: 6px;
            background-color: white;
            border-radius: 3px;
        }

        /* 메뉴 드롭다운 박스 */
        .menu-dropdown {
            display: none; /* 평소에는 숨김 */
            position: absolute;
            top: 50px;
            right: 0;
            width: 180px;
            background-color: #5f5b5b;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .menu-dropdown a {
            display: block;
            padding: 15px 20px;
            color: white;
            font-size: 18px;
            text-decoration: none;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid #746f6f;
        }

        .menu-dropdown a:last-child {
            border-bottom: none;
        }

        .menu-dropdown a:hover {
            background-color: #292c2e;
        }
    </style>
</head>
<body>
    <div class="box-1"></div>
    <div class="box-2"></div>
    <div class="box-3"></div>

    <div class="game-title">𝘿𝙞𝙣𝙤 𝙂𝙖𝙢𝙚</div>

    <div class="menu-container">
        <button class="hamburger-btn" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div id="menuDropdown" class="menu-dropdown">
            <a href="index.html">Home</a>
            <a href="key.html">Key</a>
            <a href="download.html">Download Page</a>
        </div>
    </div>

    <video id="video" autoplay muted loop>
        <source src="my-video.mp4" type="video/mp4">
    </video>

    <!-- 다운로드 버튼에 id 부여 -->
    <a href="#" id="downloadBtn" class="download-btn">Game Download</a>

    <script>
        function toggleMenu() {
            const dropdown = document.getElementById('menuDropdown');
            if (dropdown.style.display === 'block') {
                dropdown.style.display = 'none';
            } else {
                dropdown.style.display = 'block';
            }
        }

        // 화면 다른 곳을 누르면 메뉴가 닫히게 하는 기능
        window.onclick = function(event) {
            if (!event.target.closest('.menu-container')) {
                const dropdown = document.getElementById('menuDropdown');
                if (dropdown.style.display === 'block') {
                    dropdown.style.display = 'none';
                }
            }
        }

        // 다운로드 버튼 클릭 시 파일이 자동으로 다운로드되도록 처리하는 스크립트
        document.getElementById('downloadBtn').addEventListener('click', function(e) {
            e.preventDefault(); // 기본 링크 이동 방지
            
            // 실제 다운로드할 파일 경로 및 파일명 설정 (예시 경로)
            const fileName = 'DinoGame_Setup.zip';
            const fileUrl = 'DinoGame_Setup.zip';

            const a = document.createElement('a');
            a.href = fileUrl;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });
    </script>
</body>
</html>
