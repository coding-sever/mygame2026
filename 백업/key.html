<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Jump - 조작키</title>
    <style>
        body {
            width: 1880px;
            height: 1000px;
            background-color: rgb(175, 172, 172);
            position: relative;
            margin: 0;
            overflow: hidden;
        }
        .box-2 {
            width: 200px;
            height: 1020px;
            background-color: rgb(95, 91, 91);
            position: absolute;
            top: 0px;
            left: 0px;
        }
        .box-1 {
            width: 200px;
            height: 1020px;
            background-color: rgb(95, 91, 91);
            position: absolute;
            top: 0px;
            left: 1695px;
        }
        .box-3 {
            width: 1880px;
            height: 200px;
            background-color: rgb(95, 91, 91);
            position: absolute;
            top: 0px;
            left: 0px;
        }
        /* 타이틀 텍스트 스타일 */
        .game-title {
            position: absolute;
            top: 50px;
            left: 790px;
            font-size: 48px;
            font-weight: bold;
            color: white;
        }
        /* 조작키 안내 박스 스타일 */
        .controls-container {
            width: 900px;
            height: 550px;
            background-color: #848c92;
            position: absolute;
            left: 490px;
            top: 250px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);
        }
        .controls-title {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 40px;
        }
        .control-item {
            font-size: 24px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .key {
            background-color: #292c2e;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            border-bottom: 4px solid #1a1c1d;
        }

        /* --- 햄버거 메뉴 스타일 --- */
        .menu-container {
            position: absolute;
            top: 60px;
            right: 50px;
            z-index: 100;
        }
        .hamburger-btn {
            width: 45px;
            height: 40px;
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 0;
        }
        .hamburger-btn span {
            display: block;
            width: 100%;
            height: 6px;
            background-color: white;
            border-radius: 3px;
        }
        .menu-dropdown {
            display: none;
            position: absolute;
            top: 50px;
            right: 0;
            width: 180px;
            background-color: #5f5b5b;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .menu-dropdown a {
            display: block;
            padding: 15px 20px;
            color: white;
            font-size: 18px;
            text-decoration: none;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid #746f6f;
        }
        .menu-dropdown a:last-child {
            border-bottom: none;
        }
        .menu-dropdown a:hover {
            background-color: #292c2e;
        }
    </style>
</head>
<body>
    <div class="box-1"></div>
    <div class="box-2"></div>
    <div class="box-3"></div>

    <!-- 상단 타이틀 텍스트 -->
    <div class="game-title">𝘿𝙞𝙣𝙤 𝙂𝙖𝙢𝙚</div>

    <!-- 우측 상단 햄버거 메뉴 -->
    <div class="menu-container">
        <button class="hamburger-btn" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div id="menuDropdown" class="menu-dropdown">
            <a href="index.html">Home</a>
            <a href="controls.html">Key</a>
            <a href="https://example.com/download-page">Download Page</a>
        </div>
    </div>

    <!-- 조작키 안내 내용 -->
    <div class="controls-container">
        <div class="controls-title">Game Control Key</div>
        <div class="control-item">
            <span class="key">Space Bar and ↑</span>
            <span>Jump</span>
        </div>
        <div class="control-item">
            <span class="key">↓</span>
            <span>Lower Down</span>
        </div>
        <div class="control-item">
            <span class="key">→</span>
            <span>Right</span>
        </div>
        <div class="control-item">
            <span class="key">←</span>
            <span>left</span>
        </div>
    </div>

    <!-- 메뉴 토글 스크립트 -->
    <script>
        function toggleMenu() {
            const dropdown = document.getElementById('menuDropdown');
            dropdown.style.display = (dropdown.style.display === 'block') ? 'none' : 'block';
        }

        window.onclick = function(event) {
            if (!event.target.closest('.menu-container')) {
                const dropdown = document.getElementById('menuDropdown');
                if (dropdown.style.display === 'block') {
                    dropdown.style.display = 'none';
                }
            }
        }
    </script>
</body>
</html>
