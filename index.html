<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Jump</title>
    <style>
        body {
            width: 100vw;
            height: 100vh;
            background-color: rgb(175, 172, 172);
            position: relative;
            margin: 0;
            overflow: hidden;
        }
        .box-2 {
            width: 150px;
            height: 100%;
            background-color: rgb(95, 91, 91);
            position: absolute;
            top: 0;
            left: 0;
        }
        .box-1 {
            width: 150px;
            height: 100%;
            background-color: rgb(95, 91, 91);
            position: absolute;
            top: 0;
            right: 0;
        }
        .box-3 {
            width: 100%;
            height: 180px;
            background-color: rgb(95, 91, 91);
            position: absolute;
            top: 0;
            left: 0;
        }
        #video {
            width: calc(100% - 300px);
            height: calc(100% - 180px);
            object-fit: cover;
            position: absolute;
            left: 150px;
            top: 180px;
        }
        /* 타이틀 및 PC 게임 텍스트 컨테이너 */
        .title-container {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 101;
        }
        .game-title {
            font-size: clamp(32px, 4vw, 48px);
            font-weight: bold;
            color: white;
            white-space: nowrap;
        }
        .pc-badge {
            font-size: clamp(14px, 1.5vw, 18px);
            color: #dcd6d6;
            background-color: #3a3838;
            padding: 3px 12px;
            border-radius: 12px;
            margin-top: 5px;
            font-weight: bold;
        }

        /* 다운로드 버튼 스타일 */
        .download-btn {
            width: min(300px, 80vw);
            height: 70px;
            background-color: #848c92;
            color: white;
            font-size: clamp(18px, 2vw, 24px);
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            left: 50%;
            top: 60%;
            transform: translate(-50%, -50%);
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            z-index: 10;
        }
        .download-btn:hover {
            background-color: #292c2e;
        }

        /* 햄버거 메뉴 및 메뉴창 스타일 */
        .menu-container {
            position: absolute;
            top: 40px;
            right: 40px;
            z-index: 100;
        }
        .hamburger-btn {
            width: 45px;
            height: 40px;
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 0;
        }
        .hamburger-btn span {
            display: block;
            width: 100%;
            height: 6px;
            background-color: white;
            border-radius: 3px;
        }
        .menu-dropdown {
            display: none;
            position: absolute;
            top: 50px;
            right: 0;
            width: 180px;
            background-color: #5f5b5b;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .menu-dropdown a {
            display: block;
            padding: 15px 20px;
            color: white;
            font-size: 18px;
            text-decoration: none;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid #746f6f;
        }
        .menu-dropdown a:last-child {
            border-bottom: none;
        }
        .menu-dropdown a:hover {
            background-color: #292c2e;
        }

        @media (max-width: 768px) {
            .box-1, .box-2 {
                display: none;
            }
            #video {
                width: 100%;
                left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="box-1"></div>
    <div class="box-2"></div>
    <div class="box-3"></div>

    <div class="title-container">
        <div class="game-title">𝘿𝙞𝙣𝙤 𝙂𝙖𝙢𝙚</div>
        <div class="pc-badge">PC 게임</div>
    </div>

    <div class="menu-container">
        <button class="hamburger-btn" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div id="menuDropdown" class="menu-dropdown">
            <a href="index.html">Home</a>
            <a href="key.html">Key</a>
            <a href="download.html">Download Page</a>
        </div>
    </div>

    <video id="video" autoplay muted loop>
        <source src="my-video.mp4" type="video/mp4">
    </video>

    <a href="#" id="downloadBtn" class="download-btn">Game Download</a>

    <script>
        function toggleMenu() {
            const dropdown = document.getElementById('menuDropdown');
            dropdown.style.display = (dropdown.style.display === 'block') ? 'none' : 'block';
        }

        window.onclick = function(event) {
            if (!event.target.closest('.menu-container')) {
                const dropdown = document.getElementById('menuDropdown');
                if (dropdown.style.display === 'block') {
                    dropdown.style.display = 'none';
                }
            }
        }

        document.getElementById('downloadBtn').addEventListener('click', function(e) {
            e.preventDefault();
            
            const fileName = 'DinoGame_Setup.zip';
            const fileUrl = 'DinoGame_Setup.zip';

            const a = document.createElement('a');
            a.href = fileUrl;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });
    </script>
</body>
</html>
